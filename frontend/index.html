<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CollabDoc — rédaction collaborative</title>
    <meta name="theme-color" content="#4f46e5" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%234f46e5%27/%3E%3Cpath d=%27M12 19h7M15.5 5.5a1.6 1.6 0 0 1 2.3 2.3L8 17.6l-3 .8.8-3z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E" />
    <!-- Runtime configuration (API / WebSocket URLs), written by scripts/deploy.sh -->
    <script src="/config.js"></script>
    <!-- Apply the theme before the first paint (no flash): saved choice, else system preference. -->
    <script>
      try {
        var t = localStorage.getItem('collabdoc.theme')
        document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
